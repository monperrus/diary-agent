[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fbagent"
version = "0.1.0"
description = "Coding agent whose context grows by a fixed token budget per step (built on agentknit)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Martin Monperrus"}]
dependencies = ["agentknit"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "mypy", "ruff"]

[project.scripts]
fbagent = "fbagent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["fbagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
