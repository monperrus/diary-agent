[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fbagent"
version = "0.1.0"
description = "The Diary Agent: a coding agent that only remembers a short diary entry per step (built on agentknit)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Martin Monperrus"}]
# step_reducer / side_query(max_tokens=, preamble=, count_usage=) are not on PyPI yet.
dependencies = ["agentknit @ git+https://github.com/monperrus/agentknit"]

[project.urls]
Homepage = "https://github.com/monperrus/diary-agent"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "mypy", "ruff"]

[project.scripts]
fbagent = "fbagent.__main__:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["fbagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
